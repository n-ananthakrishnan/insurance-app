name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build web
        working-directory: apps/web
        run: npm run build
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: apps/web/lighthouse.config.js
        env:
          # Point at the production or staging URL. For PRs, use the Vercel
          # preview URL supplied by the Vercel GitHub app if available.
          LIGHTHOUSE_PAGES: |
            https://sample-insurance-jp.example.com/
            https://sample-insurance-jp.example.com/products
            https://sample-insurance-jp.example.com/products/example-product
